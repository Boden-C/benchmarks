# Global Benchmark Configuration
# This file provides framework-level defaults that can be overridden by
# benchmark-specific configs or environment variables.

# Execution Configuration
execution:
  # MCP server operation timeout (seconds)
  mcp_timeout: 30
  
  # Task execution timeout (seconds)
  task_timeout: 300
  
  # Maximum retry attempts for failed operations
  max_retries: 3
  
  # Default MCP server port
  default_port: 8000
  
  # Number of distraction servers to add
  distraction_servers_count: 2
  
  # Delay between retry attempts (seconds)
  retry_delay: 1
  
  # Delay between tasks (seconds)
  task_delay: 0
  
  # Maximum agentic execution rounds
  max_execution_rounds: 10
  
  # Maximum information compression attempts
  compression_retries: 3
  
  # Concurrent server connection limit
  server_semaphore_limit: 10
  
  # Content size threshold for summarization (characters)
  content_summary_threshold: 10000
  
  # Maximum content length before truncation (characters)
  content_truncate_length: 50000
  
  # Maximum error message length (characters)
  error_truncate_length: 1000
  
  # Tools requiring sequential execution
  sequential_only_tools: []

# LLM Configuration
llm:
  # Token limit for planning prompts
  planning_tokens: 16000
  
  # Max tokens for summarization responses
  summarization_max_tokens: 4000
  
  # Max tokens for evaluation responses
  evaluation_max_tokens: 4000
  
  # Token reduction sequence
  token_reduction_factors: [0.8, 0.6, 0.4]
  
  # Azure OpenAI API version
  azure_api_version: "2024-08-01-preview"

# Benchmark Configuration
benchmark:
  # Default tasks file path
  tasks_file: "questions.jsonl"
  
  # All task files for comprehensive runs
  all_task_files: []
  
  # LLM judge stability testing flag
  enable_judge_stability: false
  
  # Filter known problematic tools
  filter_problematic_tools: true
  
  # Enable concurrent summarization
  concurrent_summarization: false
  
  # Use fuzzy task descriptions instead of concrete
  use_fuzzy_descriptions: false
  
  # Include concrete description references
  concrete_description_ref: true

# Cache Configuration
cache:
  # Tool call caching enabled flag
  enabled: false
  
  # Cache directory path
  dir: ".cache/"
  
  # Cache time-to-live (seconds)
  ttl: 86400
  
  # Maximum cache size (MB)
  max_size_mb: 1000
  
  # Cache key generation strategy
  key_strategy: "content_hash"
  
  # Log cache statistics
  log_stats: true
  
  # Cache cleanup interval (seconds)
  cleanup_interval: 3600
  
  # Servers eligible for caching
  server_whitelist: []

# Results Configuration
results:
  # Output directory for results
  output_dir: "./results"
  
  # Save intermediate results
  save_intermediate: true
  
  # Pretty print JSON output
  pretty_print: true
